[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-analysis"
version = "0.1.0"
description = "Deterministic analysis of messy .xlsx workbooks: table detection, normalization, and profiling."
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
excel-analyze = "excel_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["excel_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
